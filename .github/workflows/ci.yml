name: Vinergy CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  db-check:
    name: Verify DB Schema & Seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run seed & reset validation
        run: python db/check_seed.py

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Throwaway PostgreSQL so the reservation and station integration tests run instead of skipping.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vinergy
          POSTGRES_PASSWORD: vinergy
          POSTGRES_DB: vinergy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vinergy -d vinergy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vinergy:vinergy@localhost:5432/vinergy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
